<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نموذج حيّ: متجر / كتالوج منتجات | نخبة ستوديو</title>
<meta name="description" content="نموذج حيّ لمتجر إلكتروني/كتالوج منتجات: أقسام، صور، أسعار، وسلة طلبات تُرسل عبر واتساب. من نخبة ستوديو.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://younisgaith1-ctrl.github.io/nukhba-site/demos/store.html">
<link rel="icon" type="image/svg+xml" href="../logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#070a0f;--bg2:#0c111a;--card:#111926;--line:#1f2a3a;--acc:#3ee07f;--acc2:#19b45a;--gold:#f0b74a;--violet:#7b6cff;--text:#eef3f9;--muted:#93a3b8}
  body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.8}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}
  nav{border-bottom:1px solid var(--line);background:rgba(7,10,15,.85);position:sticky;top:0;z-index:10;backdrop-filter:blur(12px)}
  nav .wrap{display:flex;justify-content:space-between;align-items:center;height:64px}
  nav b{color:var(--acc)} nav a{color:var(--muted);text-decoration:none;font-size:14.5px}
  nav a:hover{color:var(--acc)}
  header{padding:52px 0 20px;text-align:center}
  h1{font-size:clamp(26px,5vw,40px);font-weight:900}
  .sub{color:var(--muted);max-width:620px;margin:12px auto 0}
  .badge{display:inline-block;background:rgba(62,224,127,.12);border:1px solid rgba(62,224,127,.3);color:var(--acc);font-size:13px;font-weight:800;padding:5px 14px;border-radius:99px;margin-bottom:16px}
  .tabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:26px 0 6px}
  .tab{background:#0b1119;border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:8px 18px;cursor:pointer;font-family:inherit;font-size:14.5px;font-weight:700}
  .tab.on{color:#04120a;background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent}
  .grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin:24px 0}
  .prod{background:linear-gradient(180deg,var(--card),#0e1521);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:transform .16s}
  .prod:hover{transform:translateY(-4px)}
  .prod .ph{height:140px;display:grid;place-items:center;font-size:46px;background:linear-gradient(135deg,#16263c,#0c141d)}
  .prod .b{padding:16px}
  .prod h3{font-size:16.5px}
  .prod .d{color:var(--muted);font-size:13.5px;min-height:38px}
  .prod .row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
  .prod .pr{color:var(--gold);font-weight:900}
  .add{background:rgba(62,224,127,.14);border:1px solid rgba(62,224,127,.35);color:var(--acc);border-radius:10px;padding:7px 14px;font-weight:800;font-family:inherit;cursor:pointer;font-size:13.5px}
  .add:hover{background:rgba(62,224,127,.24)}
  .cartbar{position:sticky;bottom:14px;background:linear-gradient(135deg,rgba(62,224,127,.16),rgba(123,108,255,.14));border:1px solid var(--line);border-radius:18px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;backdrop-filter:blur(10px);margin-top:20px}
  .cartbar b{font-size:15.5px}
  .go{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04120a;font-weight:900;border:none;border-radius:12px;padding:12px 24px;font-family:inherit;font-size:15.5px;cursor:pointer}
  footer{border-top:1px solid var(--line);margin-top:44px;padding:30px 0;color:var(--muted);font-size:14px;text-align:center}
  footer a{color:var(--acc);text-decoration:none}
</style>
</head>
<body>
<nav><div class="wrap"><a href="../">← نخبة ستوديو</a><a href="../en.html">English</a></div></nav>
<div class="wrap">
  <header>
    <div class="badge">نموذج حيّ قابل للتخصيص</div>
    <h1>متجر / كتالوج منتجات</h1>
    <p class="sub">أقسام، منتجات، أسعار، وسلة تُرسل الطلب مباشرة إلى واتساب المتجر — بدون أي نظام دفع معقّد.</p>
  </header>

  <div class="tabs" id="tabs">
    <button class="tab on" data-c="all">الكل</button>
    <button class="tab" data-c="clothes">ملابس</button>
    <button class="tab" data-c="tech">إلكترونيات</button>
    <button class="tab" data-c="gift">هدايا</button>
  </div>

  <div class="grid" id="grid"></div>

  <div class="cartbar">
    <b>🛒 السلة: <span id="count">0</span> منتج · <span id="total">0</span> د.ع</b>
    <button class="go" id="order">إتمام الطلب عبر واتساب</button>
  </div>

  <footer>© 2026 نخبة ستوديو · <a href="https://wa.me/9647502331665">اطلب متجرك الآن</a></footer>
</div>
<script>
  var items = [
    {n:'قميص قطن',   c:'clothes', e:'👕', p:25000, d:'قطن 100% — مقاسات S–XXL'},
    {n:'حذاء رياضي', c:'clothes', e:'👟', p:55000, d:'خفيف ومريح للاستخدام اليومي'},
    {n:'عباية أنيقة', c:'clothes', e:'🧥', p:70000, d:'تصميم عصري — ألوان متعددة'},
    {n:'هاتف ذكي',   c:'tech',    e:'📱', p:320000, d:'شاشة كبيرة وبطارية قوية'},
    {n:'سماعات',     c:'tech',    e:'🎧', p:45000, d:'صوت نقي + بلوتوث'},
    {n:'ساعة ذكية',  c:'tech',    e:'⌚', p:65000, d:'تتبع النشاط والإشعارات'},
    {n:'باقة هدية',  c:'gift',    e:'🎁', p:35000, d:'تغليف فاخر + بطاقة إهداء'},
    {n:'عطر',        c:'gift',    e:'🧴', p:40000, d:'ثبات طويل — رجالي/نسائي'},
    {n:'محفظة جلد',  c:'gift',    e:'👛', p:30000, d:'جلد طبيعي — نقش الاسم مجانًا'}
  ];
  var cart = {}, cur = 'all';
  var grid = document.getElementById('grid');
  function fmt(x){return x.toLocaleString('en-US')}
  function draw(){
    grid.innerHTML = items.filter(function(i){return cur==='all'||i.c===cur}).map(function(i,idx){
      var gi = items.indexOf(i);
      return '<div class="prod"><div class="ph">'+i.e+'</div><div class="b"><h3>'+i.n+'</h3><div class="d">'+i.d+'</div>'
        +'<div class="row"><span class="pr">'+fmt(i.p)+' د.ع</span><button class="add" data-i="'+gi+'">أضف للسلة</button></div></div></div>';
    }).join('');
    bind();
  }
  function bind(){
    document.querySelectorAll('.add').forEach(function(b){
      b.addEventListener('click', function(){
        var k = b.dataset.i; cart[k] = (cart[k]||0)+1; sync();
        b.textContent = 'أُضيف ✓'; setTimeout(function(){b.textContent='أضف للسلة'},900);
      });
    });
  }
  function sync(){
    var c=0,t=0;
    for(var k in cart){c+=cart[k]; t+=cart[k]*items[k].p}
    document.getElementById('count').textContent=c;
    document.getElementById('total').textContent=fmt(t);
  }
  document.querySelectorAll('.tab').forEach(function(tb){
    tb.addEventListener('click', function(){
      document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on')});
      tb.classList.add('on'); cur = tb.dataset.c; draw();
    });
  });
  document.getElementById('order').addEventListener('click', function(){
    var lines=['طلب جديد من المتجر','------------------'];
    for(var k in cart){ lines.push(items[k].n+' × '+cart[k]+' = '+fmt(cart[k]*items[k].p)+' د.ع') }
    if(lines.length===2){ alert('السلة فارغة — أضف منتجات أولًا'); return }
    var t=0; for(var k2 in cart){t+=cart[k2]*items[k2].p}
    lines.push('------------------'); lines.push('الإجمالي: '+fmt(t)+' د.ع');
    window.open('https://wa.me/9647502331665?text='+encodeURIComponent(lines.join('\n')),'_blank');
  });
  draw();
</script>
</body>
</html>
